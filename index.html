<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrisisGuardian: Disaster Preparedness</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* New WonderKids Theme Palette */
      --brand-purple: #6A44D2;
      --brand-yellow: #FFD15C;
      --brand-light-purple: #E8E4F9;
      --brand-bg: #F7F5FD;
      --brand-text: #3D2C7A;
      --brand-slate: #7B72A4;
      --brand-white: #FFFFFF;

      /* Dark Mode Palette */
      --dark-bg: #1A103A;
      --dark-surface: #291E52;
      --dark-text: #E8E4F9;

      --font-heading: 'Fredoka', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--brand-bg);
      background-image: radial-gradient(circle at top left, var(--brand-light-purple), var(--brand-bg) 40%);
      color: var(--brand-text);
      background-attachment: fixed;
    }

    .dark body {
        background-color: var(--dark-bg);
        background-image: radial-gradient(circle at top left, var(--dark-surface), var(--dark-bg) 40%);
        color: var(--dark-text);
    }

    h1, h2, h3, .font-heading {
      font-family: var(--font-heading);
      font-weight: 600;
      color: var(--brand-text);
    }
    .dark h1, .dark h2, .dark h3, .dark .font-heading {
       color: var(--dark-text);
    }
    
    .no-scroll {
        overflow: hidden;
    }
    
    .soft-shadow {
      box-shadow: 0 4px 12px rgba(106, 68, 210, 0.08);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .soft-shadow-hover:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 10px 25px rgba(106, 68, 210, 0.15);
    }

    .highlight-yellow {
      position: relative;
      display: inline-block;
    }
    .highlight-yellow::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: -5%;
      right: -5%;
      height: 45%;
      background-color: var(--brand-yellow);
      border-radius: 8px;
      z-index: 0;
      transform: rotate(-1deg);
    }
    .highlight-yellow > span {
      position: relative;
      z-index: 1;
    }
    
    .underline-squiggle {
        background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none'/%3e%3cpath d='M2 6C2.41 4.93 4.14 3.75 6.2 4.15C9.33 4.75 10.25 7.33 13.5 7.5C17.43 7.7 18.42 5.25 21.5 5.25C24.58 5.25 25.57 7.75 28.5 7.5C31.43 7.25 32.42 4.75 35.5 5.25C38.58 5.75 39.57 7.75 42.5 7.5C45.43 7.25 46.42 4.75 49.5 5.25' stroke='%23FFD15C' stroke-width='3' stroke-linecap='round' stroke-linejoin='miter' stroke-dashoffset='0' fill='none'/%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: bottom;
        background-size: 100% 12px;
        padding-bottom: 8px;
    }

    /* Auth Page Animations */
    @keyframes fade-in-slow { from { opacity: 0; } to { opacity: 1; } }
    .animate-fade-in-slow { animation: fade-in-slow 1s ease-out forwards; }
    
    /* Main View Transition Animation */
    @keyframes view-fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .view-container-animation { animation: view-fade-in 0.5s ease-out forwards; }

    @keyframes fade-in-up { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in-up { animation: fade-in-up 0.4s ease-out forwards; }
    
    /* Sidebar Animations */
    @keyframes slideInFromLeft { from { transform: translateX(-100%); } to { transform: translateX(0); } }
    @keyframes slideOutToLeft { from { transform: translateX(0); } to { transform: translateX(-100%); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

    .animate-slide-in-from-left { animation: slideInFromLeft 0.3s ease-out forwards; }
    .animate-slide-out-to-left { animation: slideOutToLeft 0.3s ease-out forwards; }
    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    .animate-fade-out { animation: fadeOut 0.3s ease-out forwards; }

    /* Animations for Virtual Drill */
    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); }
    }
    .animate-shake { animation: shake 0.82s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes rise { from { height: 0%; opacity: 0; } to { height: 25%; opacity: 1; } }
    .flood-overlay {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(106, 68, 210, 0.5), transparent);
      animation: rise 5s ease-in-out forwards; pointer-events: none; z-index: 5;
    }
    @keyframes fire-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(255, 209, 92, 0.7), 0 0 30px rgba(255, 209, 92, 0.5); }
      50% { box-shadow: 0 0 25px rgba(255, 209, 92, 0.9), 0 0 40px rgba(106, 68, 210, 0.6); }
    }
    .animate-fire { animation: fire-glow 2s ease-in-out infinite; }
    @keyframes wind-blow { from { transform: translateX(-150px); } to { transform: translateX(110%); } }
    .wind-line {
      position: absolute; left: 0; width: 150px; height: 2px;
      background: linear-gradient(to right, transparent, rgba(123, 114, 164, 0.4), transparent);
      border-radius: 2px; animation: wind-blow 2.5s linear infinite;
    }
    @keyframes chat-bubble-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-chat-bubble-in { animation: chat-bubble-in 0.4s ease-out forwards; }
  </style>
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark')
    } else {
      document.documentElement.classList.remove('dark')
    }
  </script>
<script type="importmap">
{
  "imports": {
    "recharts": "https://aistudiocdn.com/recharts@^3.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.20.0",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.1.1"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
