<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrisisGuardian: Disaster Preparedness</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    
    /* New Auth Page Animations */
    @keyframes fade-in-slow {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-in-slow {
      animation: fade-in-slow 1s ease-out forwards;
    }

    @keyframes slide-in-from-right {
      from {
        opacity: 0;
        transform: translateX(30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    .animate-slide-in-from-right {
      animation: slide-in-from-right 0.6s ease-out forwards;
      animation-delay: 0.2s; /* Start after brand panel fades in */
      opacity: 0; /* Start hidden */
      animation-fill-mode: forwards;
    }
    
    /* Main View Transition Animation */
    @keyframes view-fade-in {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    .view-container-animation {
      animation: view-fade-in 0.4s ease-out forwards;
    }
    
    /* Animations for Virtual Drill */
    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }
    .animate-shake {
      animation: shake 0.82s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes rise {
      from { height: 0%; opacity: 0; }
      to { height: 25%; opacity: 1; }
    }
    .flood-overlay {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(66, 153, 225, 0.7), transparent);
      animation: rise 5s ease-in-out forwards;
      pointer-events: none;
      z-index: 5;
    }

    @keyframes fire-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(255, 107, 0, 0.6), 0 0 30px rgba(255, 107, 0, 0.4); }
      50% { box-shadow: 0 0 25px rgba(255, 165, 0, 0.8), 0 0 40px rgba(255, 69, 0, 0.6); }
    }
    .animate-fire {
      animation: fire-glow 2s ease-in-out infinite;
    }

    @keyframes wind-blow {
      from { transform: translateX(-150px); }
      to { transform: translateX(110%); }
    }
    .wind-line {
      position: absolute;
      left: 0;
      width: 150px;
      height: 2px;
      background: linear-gradient(to right, transparent, rgba(156, 163, 175, 0.4), transparent);
      border-radius: 2px;
      animation: wind-blow 2.5s linear infinite;
    }
  </style>
  <script>
    // On page load or when changing themes, best to add inline in `head` to avoid FOUC
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark')
    } else {
      document.documentElement.classList.remove('dark')
    }
  </script>
<script type="importmap">
{
  "imports": {
    "recharts": "https://aistudiocdn.com/recharts@^3.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.20.0"
  }
}
</script>
</head>
<body class="bg-slate-50 dark:bg-slate-900">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
